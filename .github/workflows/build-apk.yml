name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "capacitor.config.json"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Prepare www (launch straight into the game)
        run: |
          rm -rf www
          cp -r dist www
          # dist/index.html is the landing page; the game lives in play/
          cat > www/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <script>location.replace("play/index.html");</script>
          EOF
          ls www www/play

      - name: Add Capacitor + Android platform
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Force landscape orientation
        run: |
          sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' \
            android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: daggerfall-enhanced-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
