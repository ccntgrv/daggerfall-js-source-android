name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "capacitor.config.json"
      - "android-shim/**"
      - "debug.keystore"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Prepare www (launch straight into the game)
        run: |
          rm -rf www
          cp -r dist www
          # dist/index.html is the landing page; the game lives in play/
          cat > www/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <script>location.replace("play/index.html");</script>
          EOF
          ls www www/play

      - name: Inject Android export shim
        run: |
          cp android-shim/android-bridge.js www/play/android-bridge.js
          python3 - <<'EOF'
          import re
          p = "www/play/index.html"
          s = open(p, encoding="utf-8").read()
          tag = '<script src="android-bridge.js"></script>'
          s, n = re.subn(r'(<head[^>]*>)', r'\1' + tag, s, count=1)
          print("shim injected:", n == 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Add Capacitor + Android platform
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap add android
          npx cap sync android

      - name: Force landscape orientation
        run: |
          sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' \
            android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Use a stable signing key and rising version code
        run: |
          # Same key every build = Android lets new APKs update the installed app
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"
          # Rising versionCode so each build counts as an update
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: daggerfall-enhanced-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
